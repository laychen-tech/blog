<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
{{- partial "head.html" . -}}
</head>
<body class="page-{{ .Kind }}{{ with .Section }} section-{{ . }}{{ end }}" data-page="{{ if and .IsPage (eq .Section "posts") }}post{{ else if .IsHome }}home{{ else }}page{{ end }}">
  <div class="page-grain" aria-hidden="true"></div>
  {{- partial "header.html" . -}}
  <main id="main">
    {{- block "main" . }}{{ end -}}
  </main>
  {{- partial "footer.html" . -}}
  {{- block "scripts" . }}{{ end -}}
</body>
</html>
