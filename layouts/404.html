{{ define "main" }}
<section class="error-page">
  <div class="wrap">
    <div class="error-code">404</div>
    <div class="error-copy">
      <span class="eyebrow">SIGNAL LOST / 信号丢失</span>
      <h1>页面消失在<br>噪声里。</h1>
      <p>你访问的地址不存在，或者已经被时间归档。从这里重新开始。</p>
      <div class="error-actions">
        <a class="btn btn-solid" href="{{ "/" | relURL }}">回到首页 {{ partial "icon.html" "arrow-right" }}</a>
        <a class="btn btn-ghost" href="{{ "/archives/" | relURL }}">查看归档</a>
      </div>
    </div>
    <div class="error-signal" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>
</section>
{{ end }}
